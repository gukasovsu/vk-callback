<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <title>VK Community Analyzer</title>

  <style>
    body {
      max-width: 720px;
      margin: 40px auto;
      padding: 20px;
      font-family: Arial, sans-serif;
      line-height: 1.5;
      color: #222;
    }

    .box {
      padding: 20px;
      border: 1px solid #d8dee4;
      border-radius: 12px;
      background: #f6f8fa;
    }

    textarea {
      box-sizing: border-box;
      width: 100%;
      min-height: 150px;
      margin-top: 12px;
      padding: 12px;
    }

    button {
      margin-top: 12px;
      padding: 12px 18px;
      cursor: pointer;
    }

    .error {
      color: #b42318;
    }
  </style>
</head>

<body>
  <h1>Авторизация VK завершена</h1>

  <div class="box">
    <p id="status">
      Проверяем ответ VK…
    </p>

    <textarea
      id="result"
      readonly
      aria-label="Адрес возврата"
    ></textarea>

    <button id="copyButton" type="button">
      Скопировать адрес
    </button>
  </div>

  <script>
    const parameters = new URLSearchParams(window.location.search);
    const code = parameters.get("code");
    const error = parameters.get("error");

    const status = document.getElementById("status");
    const result = document.getElementById("result");
    const copyButton = document.getElementById("copyButton");

    result.value = window.location.href;

    if (code) {
      status.textContent =
        "Код получен. Скопируйте адрес и вернитесь в Termux.";
    } else if (error) {
      status.textContent =
        "VK вернул ошибку авторизации: " + error;
      status.className = "error";
    } else {
      status.textContent =
        "Код авторизации в адресе не найден.";
      status.className = "error";
    }

    copyButton.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(window.location.href);
        copyButton.textContent = "Скопировано";
      } catch {
        result.select();
        document.execCommand("copy");
        copyButton.textContent = "Скопировано";
      }
    });
  </script>
</body>
</html>
